# AgentVault. Only the broker's agent port is published, and only on loopback.
# The worker and mock shop have no published ports and sit on an internal network.
name: agentvault

x-hardening: &hardening
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 15s
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  broker:
    <<: *hardening
    build: { context: ., dockerfile: docker/broker.Dockerfile }
    image: agentvault/broker:local
    ports: ["127.0.0.1:7800:7800"]
    environment:
      DATA_DIR: /data
      HELPER_URL: http://host.docker.internal:47800
      WORKER_URL: http://browser-worker:7900
      WORKER_TOKEN_FILE: /run/secrets/worker_token
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [broker-data:/data]
    tmpfs: [/tmp]
    secrets: [worker_token]
    networks: [core, host-link]
    depends_on:
      browser-worker: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 256M }

  browser-worker:
    <<: *hardening
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: agentvault/browser-worker:local
    environment:
      BROKER_INTERNAL_URL: http://broker:7801
      WORKER_TOKEN_FILE: /run/secrets/worker_token
    # Chromium needs a writable profile dir and shared memory; nothing here persists.
    tmpfs: [/tmp, /home/pwuser]
    shm_size: 512m
    secrets: [worker_token]
    networks: [core, egress]
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  mock-shop:
    <<: *hardening
    profiles: [dev]
    image: agentvault/broker:local
    command: ["node", "mock-shop/server.ts"]
    networks: [core]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s

networks:
  core: { internal: true }   # broker <-> worker <-> mock shop; no route out
  host-link: {}              # broker -> native helper on the host, and the published agent port
  egress: {}                 # worker -> allowlisted websites (enforced in the worker)

volumes:
  broker-data: {}

secrets:
  worker_token: { file: ./secrets/worker_token }
